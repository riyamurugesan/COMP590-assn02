<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name = "viewport" content = "width=device-width">
        <title>Stickman Swinging</title>
    </head>
    <body>
        <canvas id="canvas" width = "500"
                height = "500" style="border:1px solid #000;"></canvas>
                
    <script type="text/javascript" src="StickFigure.js"></script>

    <script> "use strict"
        var canvas = document.getElementById('canvas');
        var context = canvas.getContext('2d');
        var stickFigure = new StickFigure(context);
    
        function mainLoop(){
            update();
            draw();
            
            requestAnimationFrame(mainLoop);
        }
        
        function draw(){
            context.clearRect(0,0, canvas.width, canvas.height);
            
            context.save();
            stickFigure.draw();
            
            context.restore();
        }
        
        function update(){
            stickFigure.update();
        
        }
        
        mainLoop();
        
    </script>

    </body>

</html>
